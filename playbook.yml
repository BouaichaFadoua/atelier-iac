- name: Configurer le site web
  hosts: localhost
  connection: local
  tasks:
    - name: Créer le dossier du site
      ansible.builtin.file:
        path: "{{ playbook_dir }}/site"
        state: directory
        mode: "0755"

    - name: Écrire la page d'accueil
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/site/index.html"
        mode: "0644"
        content: |
          <h1>Bonjour depuis Ansible - Version 2</h1>
          <p>Deuxieme version de ma page web.</p>
